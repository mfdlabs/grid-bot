name: Deploy

on:
  workflow_dispatch:
    inputs:
      components:
        description: "The list of components to deploy"
        required: true
        type: string

      nomad_environment:
        description: "The environment to deploy to"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production

      # In the form of "component,cpu:ram;component2,cpu:ram"
      nomad_resources:
        description: "The resources to use when deploying"
        required: false
        default: "grid-bot,1000:2048"
        type: string

      dry_run:
        description: "Whether to perform a dry run (i.e., validate the deployment without actually deploying)"
        required: false
        default: false
        type: boolean

permissions:
  deployments: write
  pull-requests: write
  issues: write

jobs:
  parse-input-components:
    name: Validate and find component directories
    runs-on: ubuntu-latest

    outputs:
      per-component-deployment-scripts: ${{ steps.read-deployment-scripts.outputs.per-component-deployment-scripts }}
      nomad-files: ${{ steps.components-to-nomad-jobs.outputs.nomad-files }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Needed Node Modules
        run: npm install yaml

      - name: Validate and Find components
        uses: mfdlabs/component-finder-action@v10
        id: find-component-directories
        with:
          components: ${{ github.event.inputs.components }}
          component-search-directories: services

      - name: Read Deployment Scripts
        uses: actions/github-script@v7
        id: read-deployment-scripts
        env:
          NOMAD_ENVIRONMENT: ${{ github.event.inputs.nomad_environment }}
          NOMAD_SHORT_ENVIRONMENT: ${{ github.event.inputs.nomad_environment == 'production' && 'prod' || 'stage' }}
          RBX_ENVIRONMENT: ${{ github.event.inputs.nomad_environment == 'production' && 'sitetest1' || 'sitetest3' }}

          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_TOKEN: ${{ vars.VAULT_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const yaml = require('yaml');
            const crypto = require('crypto');

            let components = ${{ steps.find-component-directories.outputs.components }};
            components = new Map(Object.entries(components));

            const perComponentDeploymentScripts = {};

            for (const [component, configFileName] of components) {
              const [, componentVersion] = component.split(':');

              process.env.NOMAD_VERSION = componentVersion;

              const componentConfigData = fs.readFileSync(configFileName, 'utf8');
              const replacedContents = componentConfigData.replace(
                /\$\{{ env.([A-Za-z_]+) }}/g,
                (_, envVar) => {
                  const value = process.env[envVar];

                  if (!value) {
                    return 'undefined';
                  }

                  return value;
                },
              );

              const componentConfig = yaml.parse(replacedContents);

              if (!componentConfig.deployment) {
                continue;
              }

              let beforeDeploymentScripts = componentConfig.deployment.before || [];
              let afterDeploymentScripts = componentConfig.deployment.after || [];

              function mapDeploymentScript(script) {
                if (script.path) {
                  const scriptPath = path.isAbsolute(script.path)
                    ? script.path
                    : path.join(path.dirname(configFileName), script.path);

                  if (!fs.existsSync(scriptPath)) {
                    throw new Error(`Deployment script file not found: ${scriptPath}`);
                  }

                  const id = script.id ?? crypto.randomBytes(8).toString('hex');

                  return {
                    id,
                    scriptData: fs.readFileSync(scriptPath, 'utf8'),
                  };
                }

                if (script.script) {
                  return {
                    id: script.id ?? crypto.randomBytes(8).toString('hex'),
                    scriptData: script.script,
                  };
                }

                throw new Error(
                  `Invalid deployment script in ${configFileName}: ${JSON.stringify(script)}`,
                );
              }

              beforeDeploymentScripts = beforeDeploymentScripts.map(mapDeploymentScript);
              afterDeploymentScripts = afterDeploymentScripts.map(mapDeploymentScript);

              perComponentDeploymentScripts[component] = {
                before: beforeDeploymentScripts,
                after: afterDeploymentScripts,
              };
            }

            core.setOutput(
              'per-component-deployment-scripts',
              JSON.stringify(perComponentDeploymentScripts),
            );

      - name: Components to Nomad Jobs
        uses: mfdlabs/component-nomad-parser-action@v18
        id: components-to-nomad-jobs
        env:
          NOMAD_ENVIRONMENT: ${{ github.event.inputs.nomad_environment }}
          NOMAD_SHORT_ENVIRONMENT: ${{ github.event.inputs.nomad_environment == 'production' && 'prod' || 'stage' }}
          RBX_ENVIRONMENT: ${{ github.event.inputs.nomad_environment == 'production' && 'sitetest1' || 'sitetest3' }}

          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_TOKEN: ${{ vars.VAULT_TOKEN }}
        with:
          components: ${{ steps.find-component-directories.outputs.components }}
          resources: ${{ github.event.inputs.nomad_resources }}

  find-related-pr:
    name: Find Related Pull Request
    runs-on: ubuntu-latest

    outputs:
      pr-number: ${{ steps.pr-number.outputs.pr-number }}

    steps:
      - name: Determine PR Number
        id: pr-number
        uses: actions/github-script@v7
        with:
          script: |
            console.log(`Event Name: ${{ github.event_name }}`);

            const headRef = '${{ github.ref }}'.replace('refs/heads/', '');
            const owner = '${{ github.repository_owner }}';
            const repo = '${{ github.repository }}'.split('/')[1];

            console.log(`Searching for PR with head: ${owner}:${headRef}`);

            const pullRequests = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${headRef}`,
              state: 'open',
            });

            const prNumber = pullRequests.data.length > 0
              ? String(pullRequests.data[0].number)
              : '';

            core.setOutput('pr-number', prNumber);

  deploy-nomad-jobs:
    name: Deploy Nomad Jobs
    runs-on: grid-bot-infra

    needs: parse-input-components
    environment: ${{ github.event.inputs.nomad_environment }}

    if: ${{ needs.parse-input-components.outputs.nomad-files != '{}' && needs.parse-input-components.outputs.nomad-files != '' }}

    outputs:
      failure-summary: ${{ steps.deploy-nomad-jobs.outputs.failure-summary }}
      deploy-summary: ${{ steps.deploy-nomad-jobs.outputs.deploy-summary }}

    env:
      NOMAD_ADDR: ${{ vars.NOMAD_ADDR }}
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}

    steps:
      - name: Setup Nomad CLI
        uses: nferch/setup-nomad@v4.0.0
        env:
          NOMAD_TLS_SKIP_VERIFY: 1

      - name: Deploy Nomad Jobs
        uses: actions/github-script@v7
        id: deploy-nomad-jobs
        env:
          NOMAD_ENVIRONMENT: ${{ github.event.inputs.nomad_environment }}
          NOMAD_SHORT_ENVIRONMENT: ${{ github.event.inputs.nomad_environment == 'production' && 'prod' || 'stage' }}
          RBX_ENVIRONMENT: ${{ github.event.inputs.nomad_environment == 'production' && 'sitetest1' || 'sitetest3' }}

          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_TOKEN: ${{ vars.VAULT_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const childProcess = require('child_process');

            const isDryRun = ${{ github.event.inputs.dry_run }};
            const perComponentDeploymentScripts =
              ${{ needs.parse-input-components.outputs.per-component-deployment-scripts }};

            let jobs = ${{ needs.parse-input-components.outputs.nomad-files }};
            jobs = new Map(Object.entries(jobs));

            const failedJobs = [];
            const failureSummary = [];
            const deploySummary = [];

            const getErrorOutput = (error) => {
              const stdout = error?.stdout?.toString?.() || '';
              const stderr = error?.stderr?.toString?.() || '';
              const message = error?.message || '';

              return [stdout, stderr, message]
                .filter(Boolean)
                .join('\n')
                .trim();
            };

            const getJobNameFromDefinition = (jobDefinition, fallback) => {
              const match = jobDefinition.match(/^\s*job\s+"([^"]+)"/m);
              return match ? match[1] : fallback;
            };

            const getNamespaceFromDefinition = (jobDefinition) => {
              const match = jobDefinition.match(/^\s*namespace\s*=\s*"([^"]+)"/m);
              return match ? match[1] : 'default';
            };

            const runNomad = (args, options = {}) => {
              const result = childProcess.spawnSync('nomad', args, {
                encoding: 'utf8',
                env: process.env,
                ...options,
              });

              const stdout = result.stdout || '';
              const stderr = result.stderr || '';
              const output = [stdout, stderr]
                .filter(Boolean)
                .join('\n')
                .trim();

              if (output) {
                console.log(output);
              }

              return {
                output,
                status: result.status,
                error: result.error,
                failed: Boolean(result.error) || result.status !== 0,
              };
            };

            const runScript = (scriptPath) => {
              const result = childProcess.spawnSync(scriptPath, [], {
                encoding: 'utf8',
                env: process.env,
              });

              const stdout = result.stdout || '';
              const stderr = result.stderr || '';
              const output = [stdout, stderr]
                .filter(Boolean)
                .join('\n')
                .trim();

              if (output) {
                console.log(output);
              }

              return {
                output,
                status: result.status,
                error: result.error,
                failed: Boolean(result.error) || result.status !== 0,
              };
            };

            const getCurrentNomadVersion = (jobName, namespace) => {
              try {
                const result = runNomad([
                  'job',
                  'inspect',
                  '-namespace',
                  namespace,
                  '-json',
                  jobName,
                ]);

                if (result.failed) {
                  throw new Error(result.output || 'Nomad inspect failed.');
                }

                const parsed = JSON.parse(result.output);

                const candidates = [
                  parsed,
                  parsed?.Job,
                  parsed?.job,
                  ...(Array.isArray(parsed) ? parsed : []),
                ];

                for (const candidate of candidates) {
                  if (candidate?.Version != null) {
                    return String(candidate.Version);
                  }

                  if (candidate?.version != null) {
                    return String(candidate.version);
                  }
                }

                console.warn(
                  `Nomad inspect returned no version for ${jobName} ` +
                  `(namespace: ${namespace}).`,
                );

                return null;
              } catch (error) {
                console.warn(
                  `Unable to inspect current Nomad version for ${jobName} ` +
                  `(namespace: ${namespace}): ${error.message}`,
                );

                return null;
              }
            };

            const getVersionFromDeploymentOutput = (output) => {
              const match = output.match(/^\s*Job Version\s*=\s*(\d+)\s*$/m);
              return match ? match[1] : null;
            };

            const getPreviousNomadVersion = (jobName, namespace) => {
              try {
                const result = runNomad([
                  'job',
                  'history',
                  '-namespace',
                  namespace,
                  '-json',
                  jobName,
                ]);

                if (result.failed) {
                  throw new Error(result.output || 'Nomad history failed.');
                }

                const parsed = JSON.parse(result.output);

                if (!Array.isArray(parsed) || parsed.length < 2) {
                  return null;
                }

                const previous = parsed[1];

                if (!previous || previous.Version == null) {
                  return null;
                }

                return String(previous.Version);
              } catch (error) {
                console.warn(
                  `Unable to inspect previous Nomad history for ${jobName} ` +
                  `(namespace: ${namespace}): ${error.message}`,
                );

                return null;
              }
            };

            const getPreviousNomadJobDefinition = (jobName, namespace) => {
              try {
                const result = runNomad([
                  'job',
                  'inspect',
                  '-namespace',
                  namespace,
                  '-json',
                  jobName,
                ]);

                if (result.failed) {
                  throw new Error(result.output || 'Nomad inspect failed.');
                }

                return result.output;
              } catch (error) {
                console.warn(
                  `Unable to inspect previous Nomad job definition for ${jobName} ` +
                  `(namespace: ${namespace}): ${error.message}`,
                );

                return null;
              }
            };

            const rollbackNomadJob = (
              jobName,
              namespace,
              previousVersion,
              previousJobSpec,
            ) => {
              try {
                if (previousVersion) {
                  console.warn(
                    `Attempting rollback for ${jobName} ` +
                    `(namespace: ${namespace}) to Nomad version ${previousVersion}`,
                  );

                  const result = runNomad([
                    'job',
                    'revert',
                    '-namespace',
                    namespace,
                    jobName,
                    previousVersion,
                  ]);

                  return !result.failed;
                }

                if (previousJobSpec) {
                  const restoreFile = path.join(
                    process.env.RUNNER_TEMP,
                    `nomad-rollback-${jobName.replace(/[^a-zA-Z0-9_.-]/g, '-')}.json`,
                  );

                  fs.writeFileSync(restoreFile, previousJobSpec);

                  console.warn(
                    `Attempting rollback for ${jobName} ` +
                    `(namespace: ${namespace}) using the saved job definition.`,
                  );

                  const result = runNomad([
                    'job',
                    'run',
                    '-namespace',
                    namespace,
                    restoreFile,
                  ]);

                  return !result.failed;
                }

                console.warn(
                  `No previous Nomad version or job definition was found for ` +
                  `${jobName} (namespace: ${namespace}); automatic rollback is not possible.`,
                );

                return false;
              } catch (error) {
                console.error(
                  `Rollback failed for ${jobName} ` +
                  `(namespace: ${namespace}): ${error.message}`,
                );

                return false;
              }
            };

            for (const [jobName, jobDefinition] of jobs) {
              const [componentName] = jobName.split(':');
              const deploymentScripts = perComponentDeploymentScripts[jobName] || {};
              const nomadJobName = getJobNameFromDefinition(
                jobDefinition,
                componentName,
              );
              const nomadNamespace = getNamespaceFromDefinition(jobDefinition);

              let previousVersion = null;
              let previousJobSpec = null;

              if (!isDryRun) {
                previousVersion = getPreviousNomadVersion(
                  nomadJobName,
                  nomadNamespace,
                );

                previousJobSpec = getPreviousNomadJobDefinition(
                  nomadJobName,
                  nomadNamespace,
                );
              }

              let beforeScriptFailed = false;

              for (const { id, scriptData } of deploymentScripts.before || []) {
                console.log(
                  `Running before deployment script for ${componentName}: ${id}`,
                );

                if (isDryRun) {
                  continue;
                }

                const scriptPath = path.join(
                  process.env.RUNNER_TEMP,
                  `before-deploy-${componentName}-${crypto.randomBytes(8).toString('hex')}.sh`,
                );

                fs.writeFileSync(scriptPath, scriptData, { mode: 0o755 });

                const result = runScript(scriptPath);

                try {
                  fs.unlinkSync(scriptPath);
                } catch {
                  // The runner cleans up temporary files automatically.
                }

                if (result.failed) {
                  const reason =
                    result.output || 'Before deployment script failed.';

                  console.error(
                    `Before deployment script failed for ${componentName}: ${id}`,
                  );

                  failureSummary.push({
                    job: jobName,
                    namespace: nomadNamespace,
                    reason: `Before deployment script failed: ${reason}`,
                    logs: result.output,
                    rolledBack: false,
                  });

                  failedJobs.push(jobName);
                  beforeScriptFailed = true;
                  break;
                }
              }

              if (beforeScriptFailed) {
                continue;
              }

              const tempFile = path.join(
                process.env.RUNNER_TEMP,
                `nomad-job-${componentName}.hcl`,
              );

              fs.writeFileSync(tempFile, jobDefinition);

              let deploymentOutput = '';
              let newVersion = null;

              if (isDryRun) {
                deploymentOutput =
                  `Dry run: no deployment was executed.\n\n${jobDefinition}`;

                console.log(deploymentOutput);
              } else {
                const result = runNomad([
                  'job',
                  'run',
                  '-namespace',
                  nomadNamespace,
                  '-detach=false',
                  tempFile,
                ]);

                deploymentOutput = result.output;

                if (result.failed) {
                  const reason =
                    result.output || 'Nomad deployment failed.';

                  console.error(
                    `Deployment failed for ${jobName}; attempting rollback...`,
                  );

                  const rollbackSucceeded = rollbackNomadJob(
                    nomadJobName,
                    nomadNamespace,
                    previousVersion,
                    previousJobSpec,
                  );

                  failureSummary.push({
                    job: jobName,
                    namespace: nomadNamespace,
                    reason,
                    logs: deploymentOutput,
                    rolledBack: rollbackSucceeded,
                  });

                  if (!rollbackSucceeded) {
                    failureSummary.push({
                      job: jobName,
                      namespace: nomadNamespace,
                      reason:
                        'Automatic rollback failed or no rollback target was available.',
                      logs: '',
                      rolledBack: false,
                    });
                  }

                  failedJobs.push(jobName);
                  continue;
                }

                // `nomad job inspect -json` has had different response shapes
                // across CLI versions. Prefer inspect, then use the version
                // printed by `nomad job run` as a reliable fallback.
                newVersion = getCurrentNomadVersion(
                  nomadJobName,
                  nomadNamespace,
                );

                if (newVersion == null) {
                  newVersion = getVersionFromDeploymentOutput(deploymentOutput);
                }
              }

              const changed = isDryRun
                ? null
                : previousVersion == null || newVersion == null
                  ? true
                  : previousVersion !== newVersion;

              deploySummary.push({
                job: jobName,
                namespace: nomadNamespace,
                nomadJobName,
                previousVersion,
                newVersion,
                changed,
                logs: deploymentOutput,
              });

              for (const { id, scriptData } of deploymentScripts.after || []) {
                console.log(
                  `Running after deployment script for ${componentName}: ${id}`,
                );

                if (isDryRun) {
                  continue;
                }

                const scriptPath = path.join(
                  process.env.RUNNER_TEMP,
                  `after-deploy-${componentName}-${crypto.randomBytes(8).toString('hex')}.sh`,
                );

                fs.writeFileSync(scriptPath, scriptData, { mode: 0o755 });

                const result = runScript(scriptPath);

                try {
                  fs.unlinkSync(scriptPath);
                } catch {
                  // The runner cleans up temporary files automatically.
                }

                if (result.failed) {
                  console.warn(
                    `After deployment script failed for ${componentName}: ${id}`,
                  );
                  console.warn(result.output);
                }
              }
            }

            core.setOutput(
              'failure-summary',
              JSON.stringify(failureSummary),
            );

            core.setOutput(
              'deploy-summary',
              JSON.stringify(deploySummary),
            );

            if (failedJobs.length > 0) {
              core.setFailed(
                `Failed to deploy the following jobs: ${failedJobs.join(', ')}`,
              );
            }

      - name: Mark old deployments inactive
        if: ${{ success() && github.event.inputs.dry_run == 'false' }}
        uses: actions/github-script@v7
        env:
          NOMAD_ENVIRONMENT: ${{ github.event.inputs.nomad_environment }}
        with:
          script: |
            const environment = process.env.NOMAD_ENVIRONMENT;

            const deployments = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment,
              per_page: 100,
            });

            const sorted = deployments.data.sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at),
            );

            const toInactivate = sorted.slice(1);

            for (const deployment of toInactivate) {
              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                per_page: 1,
              });

              const latestState = statuses.data[0]?.state;

              if (latestState === 'inactive') {
                continue;
              }

              console.log(
                `Marking deployment ${deployment.id} ` +
                `(created ${deployment.created_at}) as inactive`,
              );

              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'inactive',
              });
            }

  comment-deploy-result:
    name: Comment Deployment Result
    runs-on: ubuntu-latest

    needs:
      - parse-input-components
      - find-related-pr
      - deploy-nomad-jobs

    if: ${{ always() && needs.find-related-pr.outputs.pr-number != '' }}

    steps:
      - name: Comment Deployment Result
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.find-related-pr.outputs.pr-number }}
          NOMAD_UI_URL: ${{ vars.NOMAD_UI_URL }}
          NOMAD_ENVIRONMENT: ${{ github.event.inputs.nomad_environment }}
          DEPLOY_RESULT: ${{ needs.deploy-nomad-jobs.result }}
          FAILURE_SUMMARY: ${{ needs.deploy-nomad-jobs.outputs.failure-summary }}
          DEPLOY_SUMMARY: ${{ needs.deploy-nomad-jobs.outputs.deploy-summary }}
        with:
          github-token: ${{ secrets.DEPLOYER_TOKEN }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const environment = process.env.NOMAD_ENVIRONMENT;
            const result = process.env.DEPLOY_RESULT;
            const nomadUiUrl = (process.env.NOMAD_UI_URL || '').replace(/\/$/, '');

            const parseJson = (value, fallback) => {
              try {
                return JSON.parse(value || fallback);
              } catch (error) {
                console.warn(`Unable to parse workflow output: ${error.message}`);
                return JSON.parse(fallback);
              }
            };

            const deploySummary = parseJson(
              process.env.DEPLOY_SUMMARY,
              '[]',
            );

            const failureSummary = parseJson(
              process.env.FAILURE_SUMMARY,
              '[]',
            );

            const truncateLogs = (logs, maxLength = 15000) => {
              if (!logs) {
                return '(no logs captured)';
              }

              if (logs.length <= maxLength) {
                return logs;
              }

              return [
                logs.slice(0, maxLength),
                '',
                '... logs truncated; see the workflow run for the complete output.',
              ].join('\n');
            };

            const escapeHtml = (value) => String(value)
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;');

            const nomadJobUrl = (jobName, namespace) => {
              if (!nomadUiUrl) {
                return null;
              }

              return (
                `${nomadUiUrl}/ui/jobs/` +
                `${encodeURIComponent(jobName)}@${encodeURIComponent(namespace)}`
              );
            };

            const renderLogsDetails = (title, logs) => [
              '<details>',
              `<summary>${escapeHtml(title)}</summary>`,
              '',
              '```text',
              truncateLogs(logs),
              '```',
              '</details>',
            ].join('\n');

            const renderJobHeader = (entry) => {
              const url = nomadJobUrl(
                entry.nomadJobName,
                entry.namespace,
              );

              return url
                ? `**${entry.job}** — [Nomad job](${url})`
                : `**${entry.job}**`;
            };

            const renderRollbackHint = (entry) => {
              if (entry.previousVersion == null) {
                return '_No previous Nomad version was found for this job._';
              }

              const commandPrefix = environment === 'production'
                ? '#!prod-rollback'
                : '#!rollback';

              const componentName = entry.job.split(':')[0];

              return (
                `Rollback with reply: \`${commandPrefix}: ` +
                `${componentName},${entry.previousVersion}\``
              );
            };

            let body;

            if (result === 'success') {
              const sections = deploySummary.map((entry) => {
                let statusLine;

                if (entry.changed === null) {
                  statusLine = '_Dry run — no changes were applied._';
                } else if (entry.previousVersion == null) {
                  statusLine =
                    `🆕 New deployment (Nomad version \`${entry.newVersion ?? 'unknown'}\`)`;
                } else if (entry.newVersion == null) {
                  statusLine =
                    `🔄 Deployment completed; the resulting Nomad version could not be determined. ` +
                    `Previous version was \`${entry.previousVersion}\`.`;
                } else if (entry.previousVersion !== entry.newVersion) {
                  statusLine =
                    `🔄 Updated: Nomad version \`${entry.previousVersion}\` ` +
                    `→ \`${entry.newVersion}\``;
                } else {
                  statusLine =
                    `➖ No changes detected; job remains at Nomad version ` +
                    `\`${entry.newVersion}\`.`;
                }

                return [
                  renderJobHeader(entry),
                  statusLine,
                  renderRollbackHint(entry),
                  '',
                  renderLogsDetails(
                    `Deployment logs for ${entry.job}`,
                    entry.logs,
                  ),
                ].join('\n');
              });

              body = [
                '## ✅ Deployment succeeded',
                '',
                `Environment: \`${environment}\``,
                '',
                sections.join('\n\n---\n\n') ||
                  '_No deployment summary was produced._',
              ].join('\n');
            } else {
              const failureSections = failureSummary.map((entry) => {
                const rollbackLine = entry.rolledBack === true
                  ? '↩️ Automatically rolled back to the previous Nomad version.'
                  : entry.rolledBack === false
                    ? '⚠️ Automatic rollback failed or no rollback target was available. Manual intervention is required.'
                    : '';

                return [
                  `**${entry.job}**`,
                  `Reason: ${entry.reason || 'Unknown failure.'}`,
                  rollbackLine,
                  '',
                  renderLogsDetails(
                    `Failure logs for ${entry.job}`,
                    entry.logs,
                  ),
                ].filter(Boolean).join('\n');
              });

              const successfulSections = deploySummary.map((entry) => [
                renderJobHeader(entry),
                entry.changed === false
                  ? `➖ No changes detected; job remains at Nomad version \`${entry.newVersion ?? 'unknown'}\`.`
                  : `🔄 Updated: Nomad version \`${entry.previousVersion ?? 'n/a'}\` ` +
                    `→ \`${entry.newVersion ?? 'unknown'}\``,
                renderLogsDetails(
                  `Deployment logs for ${entry.job}`,
                  entry.logs,
                ),
              ].join('\n'));

              body = [
                '## ❌ Deployment failed',
                '',
                `Environment: \`${environment}\``,
                '',
                '### Failed jobs',
                failureSections.join('\n\n---\n\n') ||
                  '_No detailed failure information was captured._',
                successfulSections.length > 0
                  ? [
                      '',
                      '### Jobs that deployed successfully',
                      '',
                      successfulSections.join('\n\n---\n\n'),
                    ].join('\n')
                  : '',
                '',
                `[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
