name: Build and Deploy via PR

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  build-deploy:
    name: Build and Deploy via PR
    runs-on: ubuntu-latest
    if: ${{ github.event.issue.pull_request && (startsWith(github.event.comment.body, '#!build-deploy:') || startsWith(github.event.comment.body, '#!prod-build-deploy:')) }}
    steps:
      - name: Ensure user is authorized to build and deploy
        uses: actions/github-script@v7
        id: check-user
        continue-on-error: true
        env:
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        with:
          github-token: ${{ secrets.DEPLOYER_TOKEN }}
          script: |
            const authorizedTeams = ['mfdlabs/grid-bot-development'];
            const isAuthorized = await Promise.all(authorizedTeams.map(async (team) => {
              const [org, teamSlug] = team.split('/');
              const teamMembers = await github.rest.teams.listMembersInOrg({
                org,
                team_slug: teamSlug,
              });

              return teamMembers.data.some(member => member.login === process.env.COMMENT_AUTHOR);
            }));

            if (!isAuthorized.some(auth => auth)) {
              throw new Error(`User ${process.env.COMMENT_AUTHOR} is not authorized to build and deploy.`);
            }

      - name: Extract build and deployment arguments
        uses: actions/github-script@v7
        if: ${{ steps.check-user.outcome == 'success' }}
        id: extract-args
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          github-token: ${{ secrets.DEPLOYER_TOKEN }}
          script: |
            const buildDeployCommandRegex = /^#!(prod-)?build-deploy:\s*([a-zA-Z0-9_-]+)(?::([a-zA-Z0-9._-]+))?(?:@(debug|release))?(?:,([0-9]+:[0-9]+))?$/i;
            const match = process.env.COMMENT_BODY.match(buildDeployCommandRegex);

            if (!match) {
              console.log('No valid build-deploy command found in the comment.');
              return;
            }

            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1',
            });

            const [, production, component, versionSuffix, requestedBuildType, resources] = match;
            const actionInputs = {
              components: component,
              build_configuration: (requestedBuildType || 'release').toLowerCase() === 'debug' ? 'Debug' : 'Release',
              create_release: 'true',
              create_image: 'true',
              deploy_after_build: 'true',
              deploy_environment: production ? 'production' : 'staging',
            };

            if (versionSuffix) {
              actionInputs.version_suffix = versionSuffix;
            }

            if (resources) {
              actionInputs.deployment_resources = `${component},${resources}`;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });

            core.setOutput('action-inputs', JSON.stringify(actionInputs));
            core.setOutput('ref', pr.data.head.ref);

      - name: Dispatch Build
        uses: benc-uk/workflow-dispatch@v1
        if: ${{ steps.check-user.outcome == 'success' && steps.extract-args.outputs.action-inputs }}
        with:
          workflow: build.yml
          ref: ${{ steps.extract-args.outputs.ref }}
          inputs: ${{ steps.extract-args.outputs.action-inputs }}
          token: ${{ secrets.DEPLOYER_TOKEN }}