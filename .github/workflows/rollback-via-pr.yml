name: Rollback via PR

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  rollback:
    name: Rollback via PR
    runs-on: ubuntu-latest
    if: ${{ github.event.issue.pull_request && (startsWith(github.event.comment.body, '#!rollback:') || startsWith(github.event.comment.body, '#!prod-rollback:')) }}
    steps:
      - name: Ensure user is authorized to rollback
        uses: actions/github-script@v7
        id: check-user
        continue-on-error: true
        with:
          github-token: ${{ secrets.DEPLOYER_TOKEN }}
          script: |
            const authorizedTeams = ['mfdlabs/grid-bot-development'];

            const commentAuthor = `${{ github.event.comment.user.login }}`;
            const isAuthorized = await Promise.all(authorizedTeams.map(async (team) => {
              const [org, teamSlug] = team.split('/');
              const teamMembers = await github.rest.teams.listMembersInOrg({
                org,
                team_slug: teamSlug,
              });

              return teamMembers.data.some(member => member.login === commentAuthor);
            }));

            if (!isAuthorized.some(auth => auth)) {
              throw new Error(`User ${commentAuthor} is not authorized to trigger a rollback.`);
            }

      - name: Extract rollback arguments from comment
        uses: actions/github-script@v7
        if: ${{ steps.check-user.outcome == 'success' }}
        id: extract-args
        with:
          github-token: ${{ secrets.DEPLOYER_TOKEN }}
          script: |
            // Can be in the form of:
            // #!(prod?)-rollback: ${component}[,${version}]
            const commentBody = `${{ github.event.comment.body }}`;
            const rollbackCommandRegex = /^#!(?:prod-)?rollback:\s*([a-zA-Z0-9_-]+)(?:,([a-zA-Z0-9._-]+))?$/;
            const match = commentBody.match(rollbackCommandRegex);

            if (!match) {
              console.log('No valid rollback command found in the comment.');

              return;
            }

            // Add a thumbs up reaction to the comment to indicate that the command was recognized
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1',
            });

            const environment = commentBody.startsWith('#!prod-rollback:') ? 'production' : 'staging';
            const component = match[1];
            const forceVersion = match[2] || '';

            console.log(`Rolling back component: ${component}, environment: ${environment}, force_version: ${forceVersion || '(previous)'}`);

            const actionInputs = {
              component,
              nomad_environment: environment,
              force_version: forceVersion,
            };

            const prNumber = context.payload.issue.number;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('action-inputs', JSON.stringify(actionInputs));
            core.setOutput('ref', pr.data.head.ref);

      - name: Dispatch Rollback
        uses: benc-uk/workflow-dispatch@v1
        if: ${{ steps.check-user.outcome == 'success' && steps.extract-args.outputs.action-inputs }}
        with:
          workflow: rollback.yml
          ref: ${{ steps.extract-args.outputs.ref }}
          inputs: ${{ steps.extract-args.outputs.action-inputs }}
          token: ${{ secrets.DEPLOYER_TOKEN }}
