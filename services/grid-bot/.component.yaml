component: grid-bot

build:
  project_file: src/Grid.Bot.csproj
  component_directory: ./.deploy

  additional_args:
    - -p:IMAGE_TAG=${{ env.NOMAD_VERSION }}
    - -p:CI=true

  docker:
    docker_file: Dockerfile
    image_name: mfdlabs/grid-bot
    
deployment:
  before:
    - id: set-maintenance-status
      script: |
        #!/bin/sh

        # Download grpcurl

        GRPCURL_VERSION="1.9.3"
        GRPCURL_URL="https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"

        echo "[pre-deploy] Downloading grpcurl v${GRPCURL_VERSION}..."

        curl -sSL "$GRPCURL_URL" | tar -xz -C /tmp
        chmod +x /tmp/grpcurl

        if ! command -v /tmp/grpcurl >/dev/null 2>&1; then
          echo "[pre-deploy] ERROR: grpcurl not found after download." >&2
          exit 1
        fi

        # Download current version proto file
        echo "[pre-deploy] Downloading grid_bot.proto for version ${{ env.NOMAD_VERSION }}..."
        
        PROTO_URL="https://raw.githubusercontent.com/mfdlabs/grid-bot/grid-bot-${{ env.NOMAD_VERSION }}/proto/grid_bot.proto"

        curl -sSL "$PROTO_URL" -o /tmp/grid_bot.proto

        if ! [ -f /tmp/grid_bot.proto ]; then
          echo "[pre-deploy] ERROR: grid_bot.proto not found after download." >&2
          exit 1
        fi

        # If we are not alive then skip 
        GRID_BOT_GRPC_HOST="${{ env.NOMAD_ENVIRONMENT }}-grid-bot.wck02.vmminfra.dev:443"
        GRID_BOT_GRPC_SVC="grid.bot.v1.GridBotAPI"
        GRID_BOT_CHECKHEALTH_RPC="${GRID_BOT_GRPC_SVC}/CheckHealth"

        echo "[pre-deploy] Checking if grid-bot is alive at $GRID_BOT_GRPC_HOST..."

        if ! /tmp/grpcurl -insecure -import-path /tmp -proto /tmp/grid_bot.proto "$GRID_BOT_GRPC_HOST" "$GRID_BOT_CHECKHEALTH_RPC" >/dev/null 2>&1; then
          echo "[pre-deploy] grid-bot is not alive, skipping maintenance status update."
          exit 0
        fi

        # Set maintenance status to "Deploying new version ${{ env.NOMAD_VERSION }}"
        GRID_BOT_SETSTATUS_RPC="${GRID_BOT_GRPC_SVC}/SetStatus"
        MAINTENANCE_STATUS_TEXT="Deploying new version ${{ env.NOMAD_VERSION }}"

        echo "[pre-deploy] Setting maintenance status to 'Deploying new version ${{ env.NOMAD_VERSION }}'..."

        if ! /tmp/grpcurl \
          -insecure \
          -import-path /tmp \
          -proto /tmp/grid_bot.proto \
          -d "{\"maintenance_enabled\":true,\"maintenance_message\":\"${MAINTENANCE_STATUS_TEXT}\"}" \
          "$GRID_BOT_GRPC_HOST" \
          "$GRID_BOT_SETSTATUS_RPC"; then
          echo "[pre-deploy] ERROR: Failed to set maintenance status." >&2
          exit 1
        fi

        echo "[pre-deploy] Maintenance status set successfully. Waiting for 5 seconds to ensure the status is propagated..."

        sleep 5

  count: 1
  namespace: grid-bot

  job: grid-bot-${{ env.NOMAD_SHORT_ENVIRONMENT }}
  
  # Passed to the meta section in Nomad
  meta:
    ENVIRONMENT: ${{ env.NOMAD_ENVIRONMENT }}
    VERSION: ${{ env.NOMAD_VERSION }}

  constraints:
    - attribute: "${meta.deployment.capabilities}"
      operator: "set_contains"
      value: "grid-bot"

  vault_role: grid-bot-${{ env.NOMAD_ENVIRONMENT }}

  containers: # Maps to the groups section in Nomad
    - image: mfdlabs/grid-bot
      resources:
        cpu: ${{ env.NOMAD_CPU }}
        ram: ${{ env.NOMAD_RAM }}
      network:
        mode: host
        ports:
          metrics: {}
          grpc: {}
          http: {}
      services:
        - name: ${{ env.NOMAD_ENVIRONMENT }}-grid-bot
          port: metrics
          tags:
            - ${{ env.NOMAD_ENVIRONMENT }}
            - prometheus # For prometheus collector
          checks:
            - type: tcp

        - name: ${{ env.NOMAD_ENVIRONMENT }}-grid-bot
          port: http
          tags:
            - ${{ env.NOMAD_ENVIRONMENT }}

            - "traefik.enable=true"
            - "traefik.http.routers.${{ env.NOMAD_ENVIRONMENT }}-grid-bot-web.rule=(Host(`clientsettingscdn.${{ env.RBX_ENVIRONMENT }}.robloxlabs.com`) || Host(`versioncompatibility.api.${{ env.RBX_ENVIRONMENT }}.robloxlabs.com`) || Host(`avatar.${{ env.RBX_ENVIRONMENT }}.robloxlabs.com`))"
            - "traefik.http.routers.${{ env.NOMAD_ENVIRONMENT }}-grid-bot-web.entrypoints=http,https"

        - name: ${{ env.NOMAD_ENVIRONMENT }}-grid-bot
          port: grpc
          tags:
            - ${{ env.NOMAD_ENVIRONMENT }}

            - "traefik.enable=true"
            - "traefik.http.routers.${{ env.NOMAD_ENVIRONMENT }}-grid-bot-grpc.rule=Host(`${{ env.NOMAD_ENVIRONMENT }}-grid-bot.wck02.vmminfra.dev`)"
            - "traefik.http.routers.${{ env.NOMAD_ENVIRONMENT }}-grid-bot-grpc.entrypoints=https"
            - "traefik.http.services.${{ env.NOMAD_ENVIRONMENT }}-grid-bot-grpc.loadbalancer.server.scheme=h2c"

      volumes:
        - '/var/run/docker.sock:/var/run/docker.sock'
        - '/tmp/.X11-unix:/tmp/.X11-unix'

        - '/_/data/grid-bot/${{ env.NOMAD_ENVIRONMENT }}/logs:/tmp/mfdlabs/logs'
        - '/_/data/grid-bot/${{ env.NOMAD_ENVIRONMENT }}/rcc:/_/data/grid-bot/${{ env.NOMAD_ENVIRONMENT }}/rcc' # Simply here to just to ensure it actually gets created on the host

      artifacts:
        - source: "https://curl.se/ca/cacert.pem"
          destination: "local/initial"

      config_maps:

        - destination: local/scripts/00-generate-cacert.sh
          env: false
          perms: "755"
          on_change: noop
          data: |
            #!/bin/sh
            set -eu

            CACERT_INITIAL="/local/initial/cacert.pem"
            CACERT_FINAL="/_/data/grid-bot/${{ env.NOMAD_ENVIRONMENT }}/rcc/cacert.pem"

            : "$${VAULT_ADDR:?VAULT_ADDR is not set}"
            : "$${VAULT_TOKEN:?VAULT_TOKEN is not set}"

            echo "[pre-script] Fetching Vault issuer chain..."

            HTTP_CODE=$(curl -s -o /tmp/vault_ca_chain_response.json -w "%%{http_code}" \
              -H "X-Vault-Token: $${VAULT_TOKEN}" \
              "${VAULT_ADDR}/v1/pki_int/cert/ca_chain")

            if [ "$HTTP_CODE" != "200" ]; then
              echo "[pre-script] ERROR: Vault returned HTTP $${HTTP_CODE}" >&2
              cat /tmp/vault_ca_chain_response.json >&2
              exit 1
            fi

            if ! jq -e . /tmp/vault_ca_chain_response.json >/dev/null 2>&1; then
              echo "[pre-script] ERROR: response is not valid JSON" >&2
              echo "[pre-script] Raw response follows:" >&2
              cat /tmp/vault_ca_chain_response.json >&2
              exit 1
            fi

            CHAIN=$(jq -r '.data.ca_chain' /tmp/vault_ca_chain_response.json)

            if [ -z "$CHAIN" ] || [ "$CHAIN" = "null" ]; then
              echo "[pre-script] ERROR: ca_chain field missing or null" >&2
              cat /tmp/vault_ca_chain_response.json >&2
              exit 1
            fi

            echo "[pre-script] Writing combined cacert to $${CACERT_FINAL}..."
            cat "$CACERT_INITIAL" > "$CACERT_FINAL"
            printf '%s\n' "$CHAIN" >> "$CACERT_FINAL"

            echo "[pre-script] cacert.pem written successfully."

        - destination: local/scripts/01-generate-client-settings-token.sh
          env: false
          perms: "755"
          on_change: noop
          data: |
            #!/bin/sh
            set -eu

            : "$${VAULT_ADDR:?VAULT_ADDR is not set}"
            : "$${VAULT_TOKEN:?VAULT_TOKEN is not set}"

            ROLE="nomad-client-settings"

            RESPONSE=$(curl -sf \
              -H "X-Vault-Token: $${VAULT_TOKEN}" \
              -X POST \
              "$${VAULT_ADDR}/v1/auth/token/create/${ROLE}")

            TOKEN=$(echo "$${RESPONSE}" | jq -r '.auth.client_token')

            if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
              echo "[pre-script] ERROR: failed to mint client-settings token" >&2
              echo "$RESPONSE" >&2
              exit 1
            fi

            umask 077
            export ClientSettingsVaultToken="$${TOKEN}"
            echo "[pre-script] Client-settings token written."

        - destination: local/scripts/02-ensure-data-exists.sh
          env: false
          perms: "755"
          on_change: noop
          data: |
            #!/bin/sh
            set -eu

            mkdir -p /_/data/grid-bot/${{ env.NOMAD_ENVIRONMENT }}/rcc/app-data
            mkdir -p /_/data/grid-bot/${{ env.NOMAD_ENVIRONMENT }}/rcc/rcc-logs
            mkdir -p /_/data/grid-bot/${{ env.NOMAD_ENVIRONMENT }}/rcc/scripts

            cp /all/scripts/* /_/data/grid-bot/${{ env.NOMAD_ENVIRONMENT }}/rcc/scripts/ -r

        - destination: secrets/file.env
          env: true
          on_change: restart
          data: |
            MetricsBindAddress="http://{{ env "NOMAD_IP_metrics" }}:{{ env "NOMAD_PORT_metrics" }}"
            WebServerBindAddress="http://{{ env "NOMAD_IP_http" }}:{{ env "NOMAD_PORT_http" }}"
            GridBotGrpcServerEndpoint="http://{{ env "NOMAD_IP_grpc" }}:{{ env "NOMAD_PORT_grpc" }}"

            ClientSettingsVaultAddress="${{ env.VAULT_ADDR }}"

            DISPLAY=:1
            DEFAULT_LOG_LEVEL=Information
            PRE_SCRIPTS_DIR="/local/scripts"

            VAULT_ADDR="${{ env.VAULT_ADDR }}"
            VAULT_TOKEN="{{ env "VAULT_TOKEN" }}"

